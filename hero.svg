<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Fatima Aboul - Software Developer">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="10" y="10" width="880" height="340" rx="22"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SFMono-Regular', 'Courier New', monospace; }
      .fade { animation: fadeUp 0.9s ease-out both; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.6s; }
      .d3 { animation-delay: 1.0s; } .d4 { animation-delay: 1.4s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .role { opacity: 0; animation: roleCycle 9s infinite; }
      .r1 { animation-delay: 0s; } .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
      @keyframes roleCycle {
        0% { opacity: 0; transform: translateY(10px); }
        6% { opacity: 1; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(0); }
        36% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; }
      }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .spin { transform-origin: 730px 180px; animation: spin 22s linear infinite; }
      .spin2 { transform-origin: 730px 180px; animation: spin 34s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="10" y="10" width="880" height="340" rx="22" fill="#0d0e16"/>
  <rect x="10" y="10" width="880" height="340" rx="22" fill="url(#dots)"/>
  <circle cx="730" cy="180" r="190" fill="url(#glow)"/>
  <rect x="10.5" y="10.5" width="879" height="339" rx="22" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <g clip-path="url(#card)">
    <g class="fade d1">
      <rect x="48" y="44" width="230" height="30" rx="15" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.5"/>
      <circle cx="68" cy="59" r="5" fill="#22d3ee" class="pulse"/>
      <text x="82" y="64" font-size="13" fill="#7ee8f7" class="mono">open to internships</text>
    </g>

    <text x="48" y="112" font-size="18" fill="#9aa0b8" class="fade d2 mono">Hi there, I'm<tspan class="cursor" fill="#22d3ee"> _</tspan></text>

    <text x="46" y="170" font-size="58" font-weight="800" fill="url(#aurora)" class="fade d3">Fatima Aboul</text>

    <g class="mono" font-size="20" fill="#e8eaf6">
      <text x="48" y="212" class="role r1">&gt; Software Developer</text>
      <text x="48" y="212" class="role r2">&gt; Full-Stack Web Developer</text>
      <text x="48" y="212" class="role r3">&gt; AI App Builder</text>
    </g>

    <text x="48" y="248" font-size="15" fill="#9aa0b8" class="fade d4">Final-year CS student building full-stack and AI-powered apps.</text>

    <g class="fade d4" font-size="13" fill="#b9bfd9">
      <path d="M52 288 a6 6 0 1 1 12 0 c0 5 -6 10 -6 10 s-6 -5 -6 -10z" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
      <circle cx="58" cy="288" r="2" fill="#22d3ee"/>
      <text x="74" y="293">Karachi, Pakistan</text>
      <path d="M215 286 l11 -5 l11 5 l-11 5z M221 290 v5 q5 3 10 0 v-5" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="246" y="293">DHA Suffa University</text>
      <rect x="418" y="280" width="12" height="16" rx="2" fill="none" stroke="#f472b6" stroke-width="1.6"/>
      <path d="M422 284 h4" stroke="#f472b6" stroke-width="1.6"/>
      <text x="438" y="293">5 projects</text>
    </g>
  </g>

  <g clip-path="url(#card)">
    <g class="float">
      <circle cx="730" cy="180" r="120" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-dasharray="4 8"/>
      <circle cx="730" cy="180" r="80" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-dasharray="2 6"/>

      <g class="spin">
        <circle cx="850" cy="180" r="9" fill="#a78bfa"/>
        <circle cx="610" cy="180" r="6" fill="#f472b6"/>
      </g>
      <g class="spin2">
        <circle cx="730" cy="100" r="7" fill="#22d3ee"/>
        <circle cx="730" cy="260" r="5" fill="#a78bfa"/>
      </g>

      <rect x="665" y="140" width="130" height="80" rx="12" fill="#151726" stroke="#a78bfa" stroke-opacity="0.6"/>
      <circle cx="680" cy="154" r="3.5" fill="#f472b6"/>
      <circle cx="692" cy="154" r="3.5" fill="#fbbf24"/>
      <circle cx="704" cy="154" r="3.5" fill="#22d3ee"/>
      <text x="676" y="182" font-size="15" fill="#22d3ee" class="mono">&lt;/&gt;</text>
      <rect x="676" y="192" width="60" height="5" rx="2.5" fill="#a78bfa" opacity="0.7"/>
      <rect x="676" y="203" width="90" height="5" rx="2.5" fill="#f472b6" opacity="0.6"/>
    </g>
  </g>
</svg>